<main class="container-fluid py-4">
  <!-- Utilizamos el sistema de grid de Bootstrap en el form -->
  <form [formGroup]="productoForm" (ngSubmit)="onSubmit()" class="row g-4 justify-content-center">

    <!-- COLUMNA IZQUIERDA: Formulario -->
    <div class="col-12 col-lg-8">
      <div class="bg-white p-4 p-md-5 rounded shadow-sm border">
        
        <h4 class="mb-4 text-secondary">Información del Producto</h4>

        <!-- Código de Barras -->
        <div class="mb-4">
          <label class="form-label fw-bold" for="codigoQr">
            <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor" class="me-1 text-secondary">
              <path d="M40-200v-560h80v560H40Zm120 0v-560h80v560h-80Zm120 0v-560h40v560h-40Zm120 0v-560h80v560h-80Zm120 0v-560h120v560H520Zm160 0v-560h40v560h-40Zm120 0v-560h120v560H800Z" />
            </svg> 
            Código de barra
          </label>
          <input type="text" class="form-control form-control-lg" id="codigoQr" placeholder="Ingrese o escanee el código" formControlName="codigoQr" required>
          
          <!-- Contenedor SVG del Barcode -->
          <div class="mt-3 text-center bg-light rounded p-2">
            <svg id="barcode" class="img-fluid"></svg>
          </div>
        </div>

        <!-- Nombre descriptivo -->
        <div class="mb-4">
          <label class="form-label fw-bold" for="nombre">Nombre descriptivo</label>
          <div class="input-group">
            <span class="input-group-text bg-light">
              <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor" class="text-secondary">
                <path d="M856-390 570-104q-12 12-27 18t-30 6q-15 0-30-6t-27-18L103-457q-11-11-17-25.5T80-513v-287q0-33 23.5-56.5T160-880h287q16 0 31 6.5t26 17.5l352 353q12 12 17.5 27t5.5 30q0 15-5.5 29.5T856-390ZM513-160l286-286-353-354H160v286l353 354ZM260-640q25 0 42.5-17.5T320-700q0-25-17.5-42.5T260-760q-25 0-42.5 17.5T200-700q0 25 17.5 42.5T260-640Zm220 160Z" />
              </svg>
            </span>
            <input type="text" class="form-control" id="nombre" placeholder="Ej. Lentejas 500g" formControlName="nombre" required>
          </div>
          <!-- Reemplazo de mat-error por una clase nativa de bootstrap -->
          <div class="text-danger small mt-1" *ngIf="productoForm.get('nombre')?.touched && productoForm.get('nombre')?.invalid">
            El nombre es obligatorio
          </div>
        </div>

        <!-- Imagen -->
        <div class="mb-4">
          <label for="imagen" class="form-label fw-bold">Imagen del producto</label>
          <input type="file" class="form-control" id="imagen" accept="image/*" (change)="onFileSelected($event)" required>
        </div>

        <!-- Marca y Modelo agrupados -->
        <div class="row g-3 mb-4">
          <div class="col-12 col-md-6">
            <label for="marcas_select" class="form-label fw-bold">Marca</label>
            <div class="input-group">
              <select class="form-select" id="marcas_select" formControlName="marca_id" (change)="selectMarca()" required>
                <option disabled value="">Seleccione una marca</option>
                <option *ngFor="let marca of listMarcas" [value]="[marca.id]">{{marca.nombre}}</option>
              </select>
              <button type="button" class="btn btn-outline-secondary" (click)="newMarca()">Nueva</button>
            </div>
          </div>

          <div class="col-12 col-md-6">
            <label for="modelo_select" class="form-label fw-bold">Modelo</label>
            <div class="input-group">
              <select class="form-select" id="modelo_select" formControlName="modelo_id" [disabled]="!selectedMarca" (change)="selectModelo()" required>
                <option disabled value="">Seleccione un modelo</option>
                <option *ngFor="let modelo of listModelos" [value]="[modelo.id]">{{modelo.nombre}}</option>
              </select>
              <button type="button" class="btn btn-outline-secondary" [disabled]="!selectedMarca" (click)="newModelo()">Nuevo</button>
            </div>
          </div>
        </div>

        <!-- Categoría -->
        <div class="mb-4">
          <label for="categ_id" class="form-label fw-bold">Categoría</label>
          <div class="input-group">
            <select class="form-select" id="categ_id" formControlName="categ_id" (change)="selectCateg()" required>
              <option disabled value="">Seleccione una categoría</option>
              <option *ngFor="let categ of listCateg" [value]="[categ.id]">{{categ.nombre}}</option>
            </select>
            <button type="button" class="btn btn-outline-secondary" (click)="newCateg()">Nueva</button>
          </div>
        </div>

        <!-- Precios y Stock -->
        <div class="row g-3 mb-5">
          <div class="col-12 col-md-4">
            <label for="precio_costo" class="form-label fw-bold">Precio Costo</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="number" step="0.01" min="0" class="form-control" id="precio_costo" formControlName="precioCosto">
            </div>
          </div>

          <div class="col-12 col-md-4">
            <label for="precio_negocio" class="form-label fw-bold">Precio Negocio</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="number" step="0.01" min="0" class="form-control" id="precio_negocio" formControlName="precioNegocio">
            </div>
          </div>

          <div class="col-12 col-md-4">
            <label for="precio_venta" class="form-label fw-bold">Precio Público</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="number" step="0.01" class="form-control" id="precio_venta" formControlName="precioVenta" required>
            </div>
          </div>

          <div class="col-12 col-sm-6 col-md-4">
            <label for="stock" class="form-label fw-bold">Stock</label>
            <input type="number" class="form-control" id="stock" formControlName="stock" required>
          </div>

          <div class="col-12 col-sm-6 col-md-4">
            <label for="stock_minimo" class="form-label fw-bold">Stock Mínimo</label>
            <input type="number" class="form-control" id="stock_minimo" formControlName="stockMinimo" required>
          </div>
        </div>

        <!-- Botones de Acción -->
        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
          
          <!-- Botones de Guardar (Si no es edición) -->
          <button type="submit" *ngIf="!isEdith" class="btn btn-primary btn-lg px-5 w-100" [disabled]="productoForm.invalid || isLoadSave">
            <ng-container *ngIf="!isLoadSave">Guardar producto</ng-container>
            <ng-container *ngIf="isLoadSave">
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              Guardando...
            </ng-container>
          </button>

          <!-- Botones de Actualizar (Si es edición) -->
          <button type="button" *ngIf="isEdith" (click)="restartChangeUpdate()" class="btn btn-outline-secondary btn-lg w-100 w-md-auto" [disabled]="productoForm.invalid || !changeDetected()">
            Resetear
          </button>
          
          <button type="button" *ngIf="isEdith" (click)="updateProduct()" class="btn btn-dark btn-lg w-100 px-5" [disabled]="productoForm.invalid || !changeDetected() || isLoadSave">
            <ng-container *ngIf="!isLoadSave">Actualizar Producto</ng-container>
            <ng-container *ngIf="isLoadSave">
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              Guardando...
            </ng-container>
          </button>
        </div>

      </div>
    </div>

    <!-- COLUMNA DERECHA: Card de Vista Previa -->
    <div class="col-12 col-lg-4 col-xl-3 d-flex align-items-start">
      <div class="card shadow-sm w-100 border-0 bg-white sticky-top" style="top: 0;">
        <div class="card-header bg-light border-bottom-0 text-center py-3">
          <h6 class="mb-0 text-secondary">Vista Previa</h6>
        </div>
        
        <div class="p-4 text-center bg-white">
          <!-- Img-fluid ajusta la imagen automáticamente -->
          <img [src]="previewUrl || 'assets/placeholder-image.png'" class="img-fluid rounded object-fit-contain" alt="Vista previa del producto">
        </div>
        
        <div class="card-body bg-light rounded-bottom">
          <h5 class="card-title text-truncate" [title]="productoForm.get('nombre')?.value">
            {{ productoForm.get('nombre')?.value || 'Nombre del producto' }}
          </h5>
          
          <p class="fs-4 fw-bold text-dark mb-2">
            {{ (productoForm.get('precioVenta')?.value || 0) | currency:'MXN':'symbol':'1.2-2' }}
          </p>
          
          <div class="mb-4">
            <span class="badge bg-secondary">
              {{ getNameCateg(productoForm.get('categ_id')?.value) || 'Categoría' }}
            </span>
          </div>
          
          <div class="d-grid">
            <button type="button" class="btn btn-success" disabled>
              <i class="bi bi-cart-plus me-1"></i> Agregar al carrito
            </button>
          </div>
        </div>
      </div>
    </div>

  </form>
</main>
