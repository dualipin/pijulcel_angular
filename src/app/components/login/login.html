<main>

  <div class="mainContainer">
    <div class="leftCont">
      <img class="logo" [src]="negocio.logo_path">
    </div>
    <div class="rightCont">
      <div id="logoSec">
        <label id="nameEmp">{{negocio.nombre}}</label>
        <p id="desc">Servicio Profesional de diagnóstico y reparación de telefonía celular.</p>
      </div>
      <div class="initSesion">
        <h2>Iniciar sesión</h2>
        <hr />
        <form class="formLogin" (ngSubmit)="onSubmit()" method="post">

          <div class="sam-form-field" style="margin-top: 40px;">
            <input type="text" id="username" placeholder=" " required [(ngModel)]="username"
              oninput="this.setCustomValidity('')">
            <label class="itim-regular"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960"
                width="24px" fill="#e3e3e3">
                <path
                  d="M234-276q51-39 114-61.5T480-360q69 0 132 22.5T726-276q35-41 54.5-93T800-480q0-133-93.5-226.5T480-800q-133 0-226.5 93.5T160-480q0 59 19.5 111t54.5 93Zm246-164q-59 0-99.5-40.5T340-580q0-59 40.5-99.5T480-720q59 0 99.5 40.5T620-580q0 59-40.5 99.5T480-440Zm0 360q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q53 0 100-15.5t86-44.5q-39-29-86-44.5T480-280q-53 0-100 15.5T294-220q39 29 86 44.5T480-160Zm0-360q26 0 43-17t17-43q0-26-17-43t-43-17q-26 0-43 17t-17 43q0 26 17 43t43 17Zm0-60Zm0 360Z" />
              </svg>Nombre de usuario</label>
          </div>

          <div class="sam-form-field" style="margin-top: 7px;">
            <input type="password" id="password" placeholder=" " required [(ngModel)]="password">
            <label class="itim-regular"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960"
                width="24px" fill="#e3e3e3">
                <path
                  d="M280-240q-100 0-170-70T40-480q0-100 70-170t170-70q66 0 121 33t87 87h432v240h-80v120H600v-120H488q-32 54-87 87t-121 33Zm0-80q66 0 106-40.5t48-79.5h246v120h80v-120h80v-80H434q-8-39-48-79.5T280-640q-66 0-113 47t-47 113q0 66 47 113t113 47Zm0-80q33 0 56.5-23.5T360-480q0-33-23.5-56.5T280-560q-33 0-56.5 23.5T200-480q0 33 23.5 56.5T280-400Zm0-80Z" />
              </svg>Contraseña</label>
          </div>

          <input class="btn btn-light" style="margin-top: -10px;" type="submit"
            [disabled]="password === '' || username === ''" value="Iniciar sesión">
        </form>
      </div>
    </div>
  </div>
</main>
